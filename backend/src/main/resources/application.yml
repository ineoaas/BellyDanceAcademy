spring:
  application:
    name: belly-dance-academy
  threads:
    virtual:
      enabled: true
  config:
    # Local development: secrets live in the repo-root .env (git-ignored),
    # shared with docker compose. Real deployments use plain env vars.
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/bellydance}
    username: ${DATABASE_USERNAME:bellydance}
    password: ${DATABASE_PASSWORD:bellydance}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: always
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/docs
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    path: /api/docs/ui
    enabled: ${API_DOCS_ENABLED:true}

app:
  # Public URL of the React frontend — used for links in emails and for
  # Stripe/Mux redirect + CORS origins.
  frontend-url: ${APP_URL:http://localhost:3000}
  admin-email: ${ADMIN_EMAIL:info@thebellydancecompany.ae}
  currency: usd
  # Creates the first admin on startup while no admin exists (see AdminBootstrap).
  bootstrap-admin:
    name: ${BOOTSTRAP_ADMIN_NAME:}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  auth:
    session-ttl: 30d
    password-reset-ttl: 1h
    cookie-name: bda_session
    secure-cookie: ${SECURE_COOKIES:false}
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    # Resend's shared sandbox sender only delivers to the account owner
    # until a custom domain is verified.
    from: ${MAIL_FROM:Belly Dance Academy <onboarding@resend.dev>}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mux:
    token-id: ${MUX_TOKEN_ID:}
    token-secret: ${MUX_TOKEN_SECRET:}
    signing-key-id: ${MUX_SIGNING_KEY:}
    signing-private-key: ${MUX_PRIVATE_KEY:}
    webhook-secret: ${MUX_WEBHOOK_SECRET:}
    playback-token-ttl: 4h

logging:
  level:
    com.bellydanceacademy: INFO

---
spring:
  config:
    activate:
      on-profile: prod
app:
  auth:
    secure-cookie: true
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: dev
logging:
  level:
    com.bellydanceacademy: DEBUG
